name: Build Release Artifact MUSL

on:
    push:
        branches: [release/v0.2.0]

concurrency:
    group: build-release-musl-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: core.hooksPath
    GIT_CONFIG_VALUE_0: /dev/null
    CARGO_TERM_COLOR: always

jobs:
    build-release-lark-musl:
        name: Build Release MUSL (zeroclaw + channel-lark)
        runs-on: ubuntu-22.04
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - name: Self-heal Rust toolchain cache
              shell: bash
              run: ./scripts/ci/self_heal_rust_toolchain.sh 1.92.0

            - name: Ensure C toolchain
              shell: bash
              run: bash ./scripts/ci/ensure_c_toolchain.sh

            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.92.0
                  targets: x86_64-unknown-linux-musl

            - name: Ensure C toolchain for Rust builds
              shell: bash
              run: bash ./scripts/ci/ensure_cc.sh

            - name: Ensure cargo component
              shell: bash
              run: bash ./scripts/ci/ensure_cargo_component.sh 1.92.0

            - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v3
              with:
                  prefix-key: fuzz-build-release-musl
                  cache-bin: false

            - name: Install cross for MUSL build
              shell: bash
              run: |
                  cargo install cross --git https://github.com/cross-rs/cross

            - name: Build release binary (channel-lark, musl)
              shell: bash
              run: cross build --release --locked --features channel-lark --bin zeroclaw --target x86_64-unknown-linux-musl

            - name: Upload release artifact
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: zeroclaw-linux-musl-release-channel-lark-${{ github.sha }}
                  path: target/x86_64-unknown-linux-musl/release/zeroclaw
                  if-no-files-found: error
                  retention-days: 14
